name: jobtrail

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env.production
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=20']
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env.production
    ports:
      - '127.0.0.1:8030:8000'
    volumes:
      - static-files:/app/staticfiles
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384m

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:4030:80'
    volumes:
      - static-files:/static:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 64m

networks:
  internal:

volumes:
  postgres-data:
  static-files:
