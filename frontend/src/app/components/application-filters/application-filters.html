<div class="application-filters" role="search" [attr.aria-label]="'filters.label' | translate">
  <label class="visually-hidden" for="application-search">{{ 'filters.search' | translate }}</label>
  <input
    class="application-filters__search"
    id="application-search"
    type="search"
    autocomplete="off"
    [maxlength]="searchMaxLength"
    [formControl]="search"
    [placeholder]="'filters.searchPlaceholder' | translate"
  />
  <label class="visually-hidden" for="application-status-filter">
    {{ 'filters.status' | translate }}
  </label>
  <span class="application-filters__status" [class]="statusClass()">
    <select class="application-filters__status-select" id="application-status-filter" [formControl]="status">
      <option class="application-filters__option" value="all">
        {{ 'filters.allStatuses' | translate: { count: counts().all } }}
      </option>
      @for (option of statuses; track option) {
        <option
          class="application-filters__option application-filters__option--status"
          [class]="'application-filters__option--' + statusModifier(option)"
          [value]="option"
        >
          {{ 'status.' + option | translate }} ({{ counts().byStatus[option] }})
        </option>
      }
    </select>
    <svg class="application-filters__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
  </span>
  <button
    class="application-filters__chip"
    type="button"
    [attr.aria-pressed]="filters().remoteOnly"
    (click)="toggleRemote()"
  >
    {{ 'filters.remoteOnly' | translate }}
  </button>
  <button
    class="application-filters__chip"
    type="button"
    [attr.aria-pressed]="filters().followUpOnly"
    (click)="toggleFollowUp()"
  >
    {{ 'filters.followUpOnly' | translate }}
  </button>
</div>
