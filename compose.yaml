name: jobtrail

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: jobtrail
      POSTGRES_USER: jobtrail
      POSTGRES_PASSWORD: jobtrail
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobtrail -d jobtrail']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
